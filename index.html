<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Space — Enter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
:root {
  --night: #04040f;
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --gold-dim: #7a6020;
  --ink: #2a1800;
  --parchment: #f5e6c8;
  --deep-rose: #c97b84;
  --seal-red: #8b1a1a;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
  font-family: 'IM Fell English', serif;
  background: var(--night);
  cursor: crosshair;
}

/* ── SKY ── */
.sky {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, #1a1050 0%, #080820 40%, #04040f 100%);
  z-index: 0;
}

.stars-layer { position:fixed; inset:0; z-index:1; pointer-events:none; }

.star {
  position:absolute; background:rgba(255,240,180,0.9); border-radius:50%;
  animation: twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle {
  0%,100% { opacity:var(--mo,0.3); transform:scale(1); }
  50% { opacity:1; transform:scale(1.4); }
}

.shooting-star {
  position:absolute; width:120px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-light),transparent);
  animation:shoot 9s linear infinite; opacity:0;
}
@keyframes shoot {
  0%   { left:-20%; top:12%; opacity:0; transform:rotate(-22deg); }
  4%   { opacity:1; }
  18%  { left:120%; top:32%; opacity:0; transform:rotate(-22deg); }
  100% { opacity:0; }
}
.shooting-star:nth-child(2){ animation-delay:4.5s; }
.shooting-star:nth-child(3){ animation-delay:13s; top:28% !important; }

.moon {
  position:fixed; top:44px; right:80px;
  width:76px; height:76px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff8e0, #f0d060 40%, #c9a040);
  box-shadow:0 0 50px rgba(201,168,80,.45), 0 0 90px rgba(201,168,80,.15), inset -8px -4px 0 rgba(180,140,40,.3);
  z-index:2;
  animation:moonGlow 6s ease-in-out infinite;
}
@keyframes moonGlow {
  0%,100%{ box-shadow:0 0 50px rgba(201,168,80,.45),0 0 90px rgba(201,168,80,.15); }
  50%    { box-shadow:0 0 70px rgba(201,168,80,.65),0 0 130px rgba(201,168,80,.25); }
}

svg.mountains { position:fixed; bottom:0; left:0; right:0; z-index:2; pointer-events:none; }

/* ── FIREFLIES ── */
.firefly {
  position:fixed; width:4px; height:4px;
  background:var(--gold-light); border-radius:50%; pointer-events:none; z-index:3;
  box-shadow:0 0 7px 2px rgba(240,208,128,.6);
  animation:ffloat var(--dur,8s) ease-in-out infinite var(--delay,0s);
}
@keyframes ffloat {
  0%   { transform:translate(0,0); opacity:0; }
  15%  { opacity:.8; }
  50%  { transform:translate(var(--mx,40px),var(--my,-60px)); opacity:.5; }
  85%  { opacity:.3; }
  100% { transform:translate(var(--mx2,-20px),var(--my2,30px)); opacity:0; }
}

/* ── CINEMATIC BARS ── */
.bar { position:fixed; left:0; right:0; height:80px; background:#000; z-index:30; transition:height 1.1s cubic-bezier(.4,0,.2,1); }
.bar.top{ top:0; } .bar.bottom{ bottom:0; }
.bar.open{ height:0; }

/* ── LOGIN STAGE ── */
#login-stage {
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
  transition:opacity .8s ease, transform .8s ease;
}
#login-stage.exit { opacity:0; transform:scale(.88) translateY(-20px); pointer-events:none; }

.lock-symbol {
  font-size:3.2rem;
  filter:drop-shadow(0 0 22px rgba(201,168,80,.55));
  animation:float 4s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }

.login-title {
  font-family:'Cinzel',serif;
  font-size:clamp(1.5rem,4vw,2.1rem);
  color:var(--gold-light);
  text-align:center; letter-spacing:.1em;
  text-shadow:0 0 35px rgba(201,168,80,.5);
  line-height:1.5;
}
.login-title small {
  display:block; font-size:.52em;
  color:var(--gold-dim); letter-spacing:.3em;
  font-family:'IM Fell English',serif; font-style:italic;
}

.ornament { color:var(--gold-dim); font-size:1.1rem; letter-spacing:.5rem; opacity:.5; }

.pass-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }

.pass-field {
  background:rgba(255,255,255,.03);
  border:none; border-bottom:1px solid var(--gold-dim);
  color:var(--gold-light); font-family:'Cinzel',serif;
  font-size:1.8rem; letter-spacing:.6em; text-align:center;
  width:230px; padding:8px 16px; outline:none;
  caret-color:var(--gold); border-radius:2px 2px 0 0;
  transition:border-color .3s, box-shadow .3s;
  -webkit-text-security:disc; text-security:disc;
}
.pass-field:focus { border-bottom-color:var(--gold); box-shadow:0 2px 0 var(--gold); }
.pass-field.err { border-bottom-color:#cc3333; animation:shake .4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-10px);} 40%{transform:translateX(10px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

.pass-hint {
  font-style:italic; font-size:.8rem; color:var(--gold-dim);
  letter-spacing:.06em; text-align:center; min-height:20px; transition:color .3s;
}
.pass-hint.err-msg { color:#cc4444; }
.pass-hint.ok-msg  { color:#88cc88; }

.enter-btn {
  background:transparent; border:1px solid var(--gold-dim);
  color:var(--gold); font-family:'Cinzel',serif;
  font-size:.72rem; letter-spacing:.28em; padding:10px 32px;
  cursor:pointer; text-transform:uppercase; position:relative; overflow:hidden;
  transition:border-color .3s, color .3s;
}
.enter-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(201,168,80,.1),transparent);
  transform:translateX(-100%); transition:transform .4s;
}
.enter-btn:hover{ border-color:var(--gold); color:var(--gold-light); }
.enter-btn:hover::before{ transform:translateX(100%); }

.bottom-label {
  font-family:'Cinzel',serif; font-size:.65rem;
  letter-spacing:.35em; color:var(--gold-dim); opacity:.6;
  animation:blink 3s ease-in-out infinite;
}
@keyframes blink{ 0%,100%{opacity:.6;} 50%{opacity:1;} }

/* ── PARTICLES ── */
.pc { position:fixed; inset:0; pointer-events:none; z-index:20; overflow:hidden; }
.p  { position:absolute; border-radius:50%; animation:pfly 1.4s ease-out forwards; }
@keyframes pfly { 0%{opacity:1;transform:translate(0,0) scale(1);} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.1);} }
</style>
</head>
<body>

<div class="bar top" id="bTop"></div>
<div class="bar bottom" id="bBot"></div>
<div class="sky"></div>
<div class="stars-layer" id="sl"></div>
<div class="moon"></div>
<div class="stars-layer">
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
</div>
<div id="ff"></div>
<svg class="mountains" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,200 L0,120 L80,80 L160,110 L260,50 L360,90 L440,40 L520,70 L600,30 L680,65 L760,25 L840,70 L920,45 L1020,80 L1100,55 L1200,85 L1300,60 L1380,90 L1440,70 L1440,200Z" fill="#070718" opacity=".95"/>
  <path d="M0,200 L0,155 L200,140 L400,130 L600,125 L800,132 L1000,122 L1200,138 L1440,145 L1440,200Z" fill="#050512" opacity=".98"/>
</svg>
<div class="pc" id="pc"></div>

<section id="login-stage">
  <div class="lock-symbol">🔐</div>
  <h1 class="login-title">Our Space<small>A Sacred Door Awaits</small></h1>
  <div class="ornament">✦ ✦ ✦</div>
  <div class="pass-wrap">
    <input type="password" class="pass-field" id="pi" maxlength="6" autocomplete="off" placeholder="· · · · · ·" inputmode="numeric">
    <p class="pass-hint" id="ph">Enter thy secret cipher</p>
    <button class="enter-btn" id="eb">Open</button>
  </div>
  <div class="ornament" style="font-size:.7rem">✦</div>
  <p class="bottom-label">YaShrutii Since XV·XII·MMXXV</p>
</section>

<script>
// Stars
(()=>{
  const l=document.getElementById('sl');
  for(let i=0;i<230;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2.4+.4;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*78}%;--dur:${2+Math.random()*4}s;--delay:${Math.random()*6}s;--mo:${.1+Math.random()*.3}`;
    l.appendChild(s);
  }
})();
// Fireflies
(()=>{
  const c=document.getElementById('ff');
  for(let i=0;i<14;i++){
    const f=document.createElement('div'); f.className='firefly';
    f.style.cssText=`left:${10+Math.random()*80}%;top:${40+Math.random()*50}%;--dur:${6+Math.random()*6}s;--delay:${Math.random()*8}s;--mx:${(Math.random()-.5)*90}px;--my:${(Math.random()-.5)*90}px;--mx2:${(Math.random()-.5)*70}px;--my2:${(Math.random()-.5)*70}px`;
    c.appendChild(f);
  }
})();
// Cinematic open
setTimeout(()=>{ document.getElementById('bTop').classList.add('open'); document.getElementById('bBot').classList.add('open'); },200);

const PW='151225';
const pi=document.getElementById('pi');
const ph=document.getElementById('ph');
const eb=document.getElementById('eb');

function tryUnlock(){
  if(pi.value.trim()===PW){
    ph.textContent='✦ Seal recognised…';ph.className='pass-hint ok-msg';
    pi.disabled=true;eb.disabled=true;
    burst();
    setTimeout(goChoose,900);
  } else {
    pi.classList.add('err'); ph.textContent='The seal does not recognise thee.'; ph.className='pass-hint err-msg';
    setTimeout(()=>{ pi.classList.remove('err'); ph.textContent='Enter thy secret cipher'; ph.className='pass-hint'; pi.value=''; },1300);
  }
}
eb.addEventListener('click',tryUnlock);
pi.addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
pi.addEventListener('input',()=>{ if(pi.value.length===6) setTimeout(tryUnlock,200); });

function burst(){
  const pc=document.getElementById('pc');
  const cx=innerWidth/2, cy=innerHeight/2;
  const cols=['#f0d080','#c9a84c','#fff8e0','#e8c090','#ffd700','#ffe4b5'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div'); p.className='p';
    const a=Math.random()*Math.PI*2, d=80+Math.random()*300, sz=3+Math.random()*8;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};box-shadow:0 0 ${sz*2}px ${cols[0]};--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;animation-duration:${.8+Math.random()*.8}s;animation-delay:${Math.random()*.2}s`;
    pc.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
}

function goChoose(){
  document.getElementById('login-stage').classList.add('exit');
  setTimeout(()=>{ window.location.href='choose.html'; },800);
}
</script>
</body>
</html>
