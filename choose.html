<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Space — Choose Your World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#04040e;--gold:#c9a84c;--gold-l:#f0d080;--gold-d:#7a6020;
  --gold-pale:#ede0b0;--ink-dim:#9a8860;--card-bg:#0e0e24;
  --card-border:rgba(201,168,80,.18);
  --shadow:0 20px 60px rgba(0,0,0,.7),0 4px 20px rgba(201,168,80,.1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'IM Fell English',serif;background:var(--night);color:var(--gold-pale);min-height:100vh;overflow-x:hidden;}

/* ─── NIGHT SKY ─── */
.sky{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,#1a1050 0%,#080820 45%,#04040e 100%);}
.sky::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");}
.stars-layer{position:fixed;inset:0;z-index:1;pointer-events:none;}
.star{position:absolute;background:rgba(255,240,170,.9);border-radius:50%;
  animation:tw var(--d,3s) ease-in-out infinite var(--dl,0s);}
@keyframes tw{0%,100%{opacity:var(--mo,.3);transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
.moon{position:fixed;top:44px;right:80px;z-index:2;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8e0,#f0d060 40%,#c9a040);
  box-shadow:0 0 55px rgba(201,168,80,.5),0 0 100px rgba(201,168,80,.2),inset -8px -4px 0 rgba(160,120,30,.35);
  animation:moonpulse 6s ease-in-out infinite;}
@keyframes moonpulse{0%,100%{box-shadow:0 0 55px rgba(201,168,80,.5),0 0 100px rgba(201,168,80,.2);}50%{box-shadow:0 0 75px rgba(201,168,80,.7),0 0 140px rgba(201,168,80,.3);}}
.shooting-star{position:absolute;width:130px;height:1px;opacity:0;
  background:linear-gradient(90deg,transparent,var(--gold-l),transparent);
  animation:shoot var(--sd,9s) linear infinite var(--sdl,0s);}
@keyframes shoot{0%{left:-20%;top:10%;opacity:0;transform:rotate(-22deg);}4%{opacity:1;}18%{left:120%;top:30%;opacity:0;}100%{opacity:0;}}

/* ─── LANTERNS ─── */
.lanterns{position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;}
.lw{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;
  transform-origin:top center;animation:sway var(--sw,5s) ease-in-out infinite var(--dl,0s);}
@keyframes sway{0%,100%{transform:rotate(var(--sa,-4deg));}50%{transform:rotate(var(--sb,4deg));}}
.ls{width:1px;height:70px;background:linear-gradient(180deg,rgba(201,168,80,.4),rgba(201,168,80,.1));}
.lb{width:22px;height:34px;border-radius:4px 4px 6px 6px;position:relative;
  animation:lglow var(--lg,3s) ease-in-out infinite var(--ld,0s);}
@keyframes lglow{0%,100%{filter:brightness(1) drop-shadow(0 0 6px var(--lc,#c9a84c));}50%{filter:brightness(1.4) drop-shadow(0 0 16px var(--lc,#c9a84c));}}
.lb::before{content:'';position:absolute;inset:4px;background:rgba(255,255,255,.12);border-radius:2px;}
.lt{width:1px;height:14px;background:linear-gradient(180deg,rgba(201,168,80,.5),transparent);}

/* ─── FIREFLIES ─── */
.firefly{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--gold-l);
  pointer-events:none;z-index:4;box-shadow:0 0 6px 2px rgba(240,208,128,.5);
  animation:ff var(--d,8s) ease-in-out infinite var(--dl,0s);}
@keyframes ff{0%{transform:translate(0,0);opacity:0;}15%{opacity:.8;}50%{transform:translate(var(--mx,40px),var(--my,-60px));opacity:.5;}85%{opacity:.2;}100%{transform:translate(var(--mx2,-20px),var(--my2,30px));opacity:0;}}

/* ─── MOSQUE ─── */
svg.mosque{position:fixed;bottom:0;left:0;right:0;z-index:3;pointer-events:none;}

/* ─── PARTICLES ─── */
.pc{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.p{position:absolute;border-radius:50%;animation:pfly var(--dur,1.4s) ease-out forwards;}
@keyframes pfly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.1);}}

/* ─── LAYOUT ─── */
.geo-div{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 24px;}
.geo-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);}
.geo-star{color:var(--gold);font-size:.85rem;letter-spacing:.3em;}
.wrapper{position:relative;z-index:5;}
@keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.sec-lbl{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.35em;
  text-transform:uppercase;color:var(--gold);display:block;margin-bottom:10px;}

/* ─── THEME CARDS ─── */
.theme-cards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;max-width:700px;margin:0 auto;}
.tc{width:300px;border-radius:3px;cursor:pointer;position:relative;overflow:hidden;text-decoration:none;display:block;
  opacity:0;transform:translateY(20px);animation:rise .7s cubic-bezier(.22,1,.36,1) var(--ta,.2s) both;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s;}
.tc:hover{transform:translateY(-10px) scale(1.02);}
.tc::before,.tc::after{content:'';position:absolute;width:16px;height:16px;border-style:solid;}
.tc::before{top:6px;left:6px;border-width:1px 0 0 1px;}
.tc::after{bottom:6px;right:6px;border-width:0 1px 1px 0;}
.tc-g{background:linear-gradient(160deg,#fce8f0,#fdf6f0 40%,#e8f4e8);box-shadow:0 20px 55px rgba(200,120,140,.2);}
.tc-g:hover{box-shadow:0 30px 75px rgba(200,120,140,.35);}
.tc-g::before,.tc-g::after{border-color:rgba(200,140,160,.4);}
.tc-a{background:linear-gradient(160deg,#0a0820,#14102e 50%,#1a1208);box-shadow:0 20px 55px rgba(201,168,80,.15);}
.tc-a:hover{box-shadow:0 30px 75px rgba(201,168,80,.35);}
.tc-a::before,.tc-a::after{border-color:rgba(201,168,80,.3);}
.tp{height:160px;position:relative;overflow:hidden;}
.tc-g .tp{background:radial-gradient(circle at 20% 30%,rgba(252,184,200,.6),transparent 40%),radial-gradient(circle at 80% 70%,rgba(184,220,184,.5),transparent 40%),linear-gradient(160deg,#fce8f0,#e8f4e8);}
.tc-a .tp{background:radial-gradient(ellipse at 50% 0%,#2a1858,#0a0820 70%);}
.petal{position:absolute;font-size:1.3rem;animation:pf var(--pd,6s) ease-in-out infinite var(--pdl,0s);}
@keyframes pf{0%,100%{transform:translate(0,0) rotate(0);opacity:.7;}33%{transform:translate(var(--px,10px),var(--py,-15px)) rotate(20deg);opacity:1;}66%{transform:translate(var(--px2,-8px),var(--py2,10px)) rotate(-10deg);opacity:.8;}}
.mstar{position:absolute;background:rgba(255,240,160,.9);border-radius:50%;animation:tw2 var(--d,2s) ease-in-out infinite var(--dl,0s);}
@keyframes tw2{0%,100%{opacity:.2;}50%{opacity:1;}}
.mmoon{position:absolute;top:18px;right:22px;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8e0,#f0d060 40%,#c9a040);
  box-shadow:0 0 18px rgba(201,168,80,.5),inset -3px -2px 0 rgba(140,100,20,.3);
  animation:moonpulse 4s ease-in-out infinite;}
.arch-pat{position:absolute;bottom:0;left:0;right:0;height:55px;}
.tb{padding:16px 18px 22px;position:relative;z-index:2;}
.tc-g .tb{border-top:1px solid rgba(200,140,160,.15);}
.tc-a .tb{border-top:1px solid rgba(201,168,80,.12);}
.tn{font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.1em;margin-bottom:5px;}
.tc-g .tn{color:#4a2030;}.tc-a .tn{color:var(--gold-l);text-shadow:0 0 12px rgba(201,168,80,.3);}
.ts{font-style:italic;font-size:.8rem;line-height:1.5;}
.tc-g .ts{color:#8a6070;}.tc-a .ts{color:#9a8050;}
.tarr{position:absolute;bottom:16px;right:18px;font-size:1rem;opacity:.4;transition:transform .3s,opacity .3s;}
.tc:hover .tarr{transform:translateX(5px);opacity:1;}
.tarscript{font-family:'Noto Nastaliq Urdu',serif;font-size:1rem;color:var(--gold);display:block;text-align:right;margin-top:7px;opacity:.75;}

/* ─── REWARD BOX ─── */
.rbox{background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;
  padding:40px 36px 36px;text-align:center;position:relative;box-shadow:var(--shadow);overflow:hidden;}
.rbox::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold),var(--gold-d),transparent);}
.rbox-tl{position:absolute;top:10px;left:14px;font-size:.6rem;color:rgba(201,168,80,.2);}
.rbox-tr{position:absolute;top:10px;right:14px;font-size:.6rem;color:rgba(201,168,80,.2);}

/* Reward type badge */
.rtype-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;
  text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:18px;
  border:1px solid;
}
.badge-love{color:#e88;border-color:rgba(220,100,120,.3);background:rgba(200,80,100,.06);}
.badge-challenge{color:#8bc;border-color:rgba(100,160,200,.3);background:rgba(80,140,200,.06);}
.badge-throwback{color:#b8a;border-color:rgba(180,140,160,.3);background:rgba(160,120,140,.06);}

/* Chest */
.rchest{font-size:5rem;display:block;margin-bottom:4px;
  filter:drop-shadow(0 0 24px rgba(201,168,80,.45));
  animation:chestfloat 3.5s ease-in-out infinite;}
@keyframes chestfloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-10px) rotate(1deg);}}

.rdayline{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.22em;color:var(--gold-d);margin-bottom:4px;}
.rdatestr{font-style:italic;font-size:.88rem;color:var(--ink-dim);margin-bottom:22px;}

/* Reveal button */
.rbtn{background:transparent;border:1px solid var(--gold-d);color:var(--gold);
  font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.25em;
  padding:14px 44px;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
  transition:border-color .3s,color .3s,box-shadow .3s;}
.rbtn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(201,168,80,.12),transparent);
  transform:translateX(-100%);transition:transform .45s;}
.rbtn:hover{border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 22px rgba(201,168,80,.2);}
.rbtn:hover::before{transform:translateX(100%);}

/* Revealed */
.rrev{display:none;margin-top:28px;animation:revpop .7s cubic-bezier(.22,1,.36,1) both;}
@keyframes revpop{from{opacity:0;transform:scale(.84) translateY(14px);}to{opacity:1;transform:scale(1) translateY(0);}}

.rheart-big{font-size:5.5rem;display:block;margin-bottom:14px;
  animation:heartpop .55s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 0 28px rgba(220,80,100,.55));}
@keyframes heartpop{from{transform:scale(0) rotate(-25deg);}to{transform:scale(1) rotate(0);}}

.rtextbox{font-family:'IM Fell English',serif;font-style:italic;
  font-size:clamp(1rem,2.5vw,1.22rem);color:var(--gold-l);line-height:1.8;
  padding:20px 24px;border:1px solid rgba(201,168,80,.12);
  background:rgba(201,168,80,.04);border-radius:2px;
  position:relative;text-align:left;}
.rtextbox::before,.rtextbox::after{content:'\201C';font-family:'Uncial Antiqua',cursive;
  font-size:3.5rem;color:rgba(201,168,80,.15);position:absolute;line-height:1;}
.rtextbox::before{top:-10px;left:8px;}
.rtextbox::after{content:'\201D';bottom:-22px;right:8px;}
.rtextbox .challenge-label{
  display:block;font-family:'Cinzel',serif;font-style:normal;font-size:.6rem;
  letter-spacing:.2em;text-transform:uppercase;color:#8bc;margin-bottom:10px;opacity:.8;}
.rtextbox .throwback-label{
  display:block;font-family:'Cinzel',serif;font-style:normal;font-size:.6rem;
  letter-spacing:.2em;text-transform:uppercase;color:#b8a;margin-bottom:10px;opacity:.8;}

.rarabic{font-family:'Noto Nastaliq Urdu',serif;font-size:.88rem;color:var(--gold-d);margin-top:16px;text-align:right;opacity:.7;}
.rstamp{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;color:var(--gold-d);margin-top:12px;opacity:.45;}

/* Already opened */
.ral{display:none;animation:revpop .5s both;}
.rallbl{font-style:italic;font-size:.88rem;color:var(--gold-d);margin-bottom:16px;}

/* ─── CALENDAR TOGGLE ─── */
.ctbtn{display:block;margin:0 auto 28px;background:transparent;border:1px solid var(--gold-d);
  color:var(--gold);font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.3em;
  padding:14px 44px;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
  transition:border-color .3s,color .3s,box-shadow .3s;}
.ctbtn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(201,168,80,.1),transparent);
  transform:translateX(-100%);transition:transform .45s;}
.ctbtn:hover{border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 26px rgba(201,168,80,.18);}
.ctbtn:hover::before{transform:translateX(100%);}
.bchev{display:inline-block;transition:transform .4s;}
.ctbtn.open .bchev{transform:rotate(180deg);}

/* ─── CALENDAR SHELL ─── */
#calwrap{display:none;}
#calwrap.open{display:block;animation:slideD .5s cubic-bezier(.22,1,.36,1) both;}
@keyframes slideD{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

.cshell{background:var(--card-bg);border:1px solid var(--card-border);
  padding:28px 20px 24px;box-shadow:var(--shadow);position:relative;}
.cshell::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold),var(--gold-d),transparent);}

/* Year tabs */
.year-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.ytab{background:transparent;border:1px solid rgba(201,168,80,.15);color:var(--gold-d);
  font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;padding:5px 16px;
  cursor:pointer;transition:all .3s;border-radius:2px;}
.ytab:hover{border-color:rgba(201,168,80,.4);color:var(--gold);}
.ytab.active{border-color:var(--gold);color:var(--gold-l);background:rgba(201,168,80,.06);}

/* Month navigation */
.cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 4px;}
.cnbtn{background:transparent;border:1px solid rgba(201,168,80,.2);color:var(--gold-d);
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;
  transition:all .3s;display:flex;align-items:center;justify-content:center;}
.cnbtn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(201,168,80,.2);}
.cmtitle{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.15em;color:var(--gold-l);}

/* Day of week */
.cdow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.dlbl{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold-d);text-align:center;padding:3px 0;}

/* Calendar grid */
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}

/* ─── HEART DAY CELL ─── */
.cday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:default;}
.cday.empty{pointer-events:none;}
.hw{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.hsv{width:90%;height:90%;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s;}
.dnum{position:absolute;font-family:'Cinzel',serif;font-size:clamp(.45rem,.85vw,.68rem);
  font-weight:600;letter-spacing:.02em;top:50%;left:50%;transform:translate(-50%,-45%);
  pointer-events:none;z-index:3;text-align:center;line-height:1.2;}

/* PAST — deep ruby */
.cday.past .hsv path{fill:url(#hgP);}
.cday.past .dnum{color:rgba(240,208,128,.9);}
.cday.past{cursor:pointer;}
.cday.past:hover .hsv{transform:scale(1.18);filter:drop-shadow(0 0 10px rgba(201,80,80,.65));}
.cday.past:hover .dnum{color:#fff;}

/* TODAY — bright glow pulse */
.cday.todays .hsv path{fill:url(#hgT);}
.cday.todays .dnum{color:#fff;}
.cday.todays .hsv{animation:todaypulse 2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,80,100,.85));}
@keyframes todaypulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.cday.todays{cursor:pointer;}

/* FUTURE — dim locked */
.cday.future .hsv path{fill:url(#hgL);}
.cday.future .dnum{color:rgba(100,80,60,.35);}
.cday.future{opacity:.38;}
.lockover{position:absolute;font-size:clamp(.45rem,.65vw,.6rem);
  opacity:.3;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}

/* BEFORE relationship — barely there */
.cday.before{opacity:.1;pointer-events:none;}
.cday.before .hsv path{fill:rgba(25,15,35,.7);}
.cday.before .dnum{color:rgba(80,60,40,.2);}

/* ─── MODAL ─── */
.moverlay{position:fixed;inset:0;z-index:100;background:rgba(4,4,14,.9);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .3s;}
.moverlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--card-bg);border:1px solid var(--card-border);
  padding:42px 38px 34px;border-radius:3px;max-width:460px;width:100%;text-align:center;
  position:relative;box-shadow:0 30px 90px rgba(0,0,0,.9),0 0 0 1px rgba(201,168,80,.06);
  transform:scale(.87) translateY(28px);transition:transform .4s cubic-bezier(.22,1,.36,1);}
.moverlay.open .modal{transform:scale(1) translateY(0);}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold),var(--gold-d),transparent);}
.mclose{position:absolute;top:12px;right:14px;background:none;border:none;
  color:var(--gold-d);font-size:1.2rem;cursor:pointer;opacity:.5;transition:opacity .2s;font-family:'Cinzel',serif;}
.mclose:hover{opacity:1;}
.mbadge{display:inline-flex;align-items:center;gap:5px;font-family:'Cinzel',serif;
  font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;border:1px solid;margin-bottom:10px;}
.mbadge-love{color:#e88;border-color:rgba(220,100,120,.3);background:rgba(200,80,100,.06);}
.mbadge-challenge{color:#8bc;border-color:rgba(100,160,200,.3);background:rgba(80,140,200,.06);}
.mbadge-throwback{color:#b8a;border-color:rgba(180,140,160,.3);background:rgba(160,120,140,.06);}
.mdlbl{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.2em;color:var(--gold-d);margin-bottom:4px;}
.mdaynum{font-family:'Uncial Antiqua',cursive;font-size:.82rem;color:rgba(201,168,80,.32);margin-bottom:14px;}
.mheart{font-size:3.8rem;display:block;margin-bottom:16px;filter:drop-shadow(0 0 22px rgba(220,80,100,.5));}
.mtxt{font-family:'IM Fell English',serif;font-style:italic;font-size:1.05rem;line-height:1.78;
  color:var(--gold-l);padding:16px 18px;border:1px solid rgba(201,168,80,.1);
  background:rgba(201,168,80,.04);border-radius:2px;position:relative;text-align:left;}
.mtxt::before,.mtxt::after{content:'\201C';font-family:'Uncial Antiqua',cursive;
  font-size:2.5rem;color:rgba(201,168,80,.16);position:absolute;line-height:1;}
.mtxt::before{top:-6px;left:6px;}
.mtxt::after{content:'\201D';bottom:-18px;right:6px;}
.marabic{font-family:'Noto Nastaliq Urdu',serif;font-size:.82rem;color:var(--gold-d);
  text-align:right;margin-top:12px;opacity:.65;}
.mnomsg{font-style:italic;color:var(--ink-dim);font-size:.88rem;padding:10px 0;}

/* ─── MUSIC BUTTON ─── */
.music-btn{
  position:fixed;bottom:28px;left:28px;z-index:9999;
  width:46px;height:46px;border-radius:50%;
  background:rgba(14,14,36,.8);
  border:1px solid rgba(201,168,80,.25);
  box-shadow:0 0 22px rgba(201,168,80,.1),0 4px 20px rgba(0,0,0,.5);
  backdrop-filter:blur(10px);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .4s,box-shadow .4s,transform .3s;
  overflow:visible;
}
.music-btn::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,80,.12) 0%,transparent 70%);
  transform:scale(0);transition:transform .5s cubic-bezier(.22,1,.36,1);
}
.music-btn:hover{
  border-color:rgba(201,168,80,.55);
  box-shadow:0 0 38px rgba(201,168,80,.2),0 4px 24px rgba(0,0,0,.6);
  transform:scale(1.08);
}
.music-btn:hover::before{transform:scale(1);}
.music-btn.playing .disc{animation:mbspin 4s linear infinite;}
.disc{position:relative;width:24px;height:24px;flex-shrink:0;}
.disc-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(201,168,80,.6);}
.disc-ring:nth-child(2){inset:5px;border-color:rgba(240,208,128,.4);}
.disc-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;border-radius:50%;
  background:rgba(201,168,80,.8);
  box-shadow:0 0 6px rgba(201,168,80,.6);
}
@keyframes mbspin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.pause-icon{
  display:none;gap:4px;align-items:center;justify-content:center;
  width:24px;height:24px;flex-shrink:0;
}
.pause-icon span{display:block;width:3px;height:13px;border-radius:2px;background:rgba(201,168,80,.8);}
.music-btn.playing .disc{display:none;}
.music-btn.playing .pause-icon{display:flex;}
.music-btn.playing::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(201,168,80,.3);
  animation:mring 2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes mring{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.28);opacity:0;}}
.music-tip{
  position:absolute;left:58px;top:50%;transform:translateY(-50%);
  background:rgba(14,14,36,.92);border:1px solid rgba(201,168,80,.18);
  color:rgba(201,168,80,.8);

  white-space:nowrap;padding:5px 12px;border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.music-btn:hover .music-tip{opacity:1;}

<audio id="bgm" loop preload="auto">
  <source src="music/bg.mp3" type="audio/mpeg">
</audio>


<script>
(()=>{
  const btn   = document.getElementById('musicBtn');
  const audio = document.getElementById('bgm');
  let playing = false;
  audio.volume = 0.18;
  function setPlaying(s){ playing=s; btn.classList.toggle('playing',s); }
  audio.play().then(()=>setPlaying(true)).catch(()=>{});
  const startOnce=()=>{
    if(!playing){ audio.play().then(()=>setPlaying(true)).catch(()=>{}); }
    document.removeEventListener('click',startOnce);
    document.removeEventListener('touchstart',startOnce);
  };
  document.addEventListener('click',startOnce);
  document.addEventListener('touchstart',startOnce);
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    if(playing){ audio.pause(); setPlaying(false); }
    else { audio.play().then(()=>setPlaying(true)).catch(()=>{}); }
  });
  audio.addEventListener('pause',()=>setPlaying(false));
  audio.addEventListener('play', ()=>setPlaying(true));
})();
</script>
